[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-foundations-origin-functions"
version = "0.1.0"
description = "Reference contracts and evaluations for Origin as constant and source-bound functions."
requires-python = ">=3.10"
authors = [{name = "Alyssa Solen"}]
license = {text = "CC-BY-ND-4.0"}

[tool.setuptools]
packages = ["src"]
